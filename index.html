<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Countdown</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-input {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .glass-input:focus {
      border-color: #6366f1;
      outline: none;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }

    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.95; }
    }

    .animate-pulse-subtle {
      animation: pulse-subtle 3s infinite ease-in-out;
    }

    .digit-card {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="h-full text-slate-100 flex flex-col justify-between overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <header class="w-full max-w-6xl mx-auto px-4 pt-6 flex justify-between items-center z-10">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <span class="font-bold tracking-tight text-lg bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">TimePulse</span>
    </div>

    <div class="flex items-center space-x-3">
      <button id="copyShareBtn" class="flex items-center space-x-2 px-3.5 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 text-xs md:text-sm font-medium transition-all duration-200 active:scale-95 shadow-md">
        <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
        </svg>
        <span>Share Link</span>
      </button>

      <button id="toggleSettingsBtn" class="flex items-center space-x-2 px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs md:text-sm font-semibold transition-all duration-200 active:scale-95 shadow-lg shadow-indigo-600/30">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        <span>Edit Event</span>
      </button>
    </div>
  </header>

  <main class="flex-grow flex flex-col items-center justify-center px-4 py-12 relative z-0">
    <!-- Ambient Lighting FX -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none -z-10"></div>
    <div class="absolute top-1/2 left-1/3 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-violet-600/15 rounded-full blur-3xl pointer-events-none -z-10"></div>

    <div class="w-full max-w-4xl text-center space-y-8">
      
      <!-- Event Heading -->
      <div class="space-y-3">
        <h1 id="displayTitle" class="text-3xl sm:text-5xl md:text-6xl font-black tracking-tight text-white drop-shadow-sm">
          Loading Countdown...
        </h1>
        <div class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full glass-card text-xs md:text-sm text-slate-300 font-medium border border-slate-700/50">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <span id="targetFormattedDisplay">Target: Calculating...</span>
        </div>
      </div>

      <!-- Live Clock Grid -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-6 pt-4 max-w-3xl mx-auto">
        
        <!-- Days Card -->
        <div class="digit-card rounded-2xl p-4 sm:p-6 border border-slate-700/60 flex flex-col items-center justify-center transition-all duration-300 hover:border-indigo-500/50">
          <span id="daysVal" class="text-4xl sm:text-6xl md:text-7xl font-black tracking-tight text-indigo-400 font-mono">00</span>
          <span class="text-xs sm:text-sm uppercase tracking-widest text-slate-400 font-bold mt-2">Days</span>
        </div>

        <!-- Hours Card -->
        <div class="digit-card rounded-2xl p-4 sm:p-6 border border-slate-700/60 flex flex-col items-center justify-center transition-all duration-300 hover:border-indigo-500/50">
          <span id="hoursVal" class="text-4xl sm:text-6xl md:text-7xl font-black tracking-tight text-indigo-400 font-mono">00</span>
          <span class="text-xs sm:text-sm uppercase tracking-widest text-slate-400 font-bold mt-2">Hours</span>
        </div>

        <!-- Minutes Card -->
        <div class="digit-card rounded-2xl p-4 sm:p-6 border border-slate-700/60 flex flex-col items-center justify-center transition-all duration-300 hover:border-indigo-500/50">
          <span id="minutesVal" class="text-4xl sm:text-6xl md:text-7xl font-black tracking-tight text-indigo-400 font-mono">00</span>
          <span class="text-xs sm:text-sm uppercase tracking-widest text-slate-400 font-bold mt-2">Minutes</span>
        </div>

        <!-- Seconds Card -->
        <div class="digit-card rounded-2xl p-4 sm:p-6 border border-slate-700/60 flex flex-col items-center justify-center transition-all duration-300 hover:border-indigo-500/50">
          <span id="secondsVal" class="text-4xl sm:text-6xl md:text-7xl font-black tracking-tight text-rose-400 font-mono">00</span>
          <span class="text-xs sm:text-sm uppercase tracking-widest text-slate-400 font-bold mt-2">Seconds</span>
        </div>

      </div>

      <!-- Status Subtext -->
      <div id="statusMessage" class="text-sm md:text-base font-medium text-slate-400 pt-2 min-h-[1.5rem]">
        <!-- Dynamic countdown status message -->
      </div>

    </div>
  </main>

  <div id="settingsDrawer" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden transition-opacity duration-300 flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-lg rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-700/80 max-h-[90vh] overflow-y-auto">
      
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-xl font-bold text-white">Configure Countdown</h2>
          <p class="text-xs text-slate-400">Set the target date, time, and UTC offset</p>
        </div>
        <button id="closeSettingsBtn" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form id="configForm" class="space-y-4">
        
        <!-- Event Title -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Event Title</label>
          <input type="text" id="inputTitle" placeholder="e.g. New Year Celebration" class="w-full glass-input text-white rounded-xl px-4 py-2.5 text-sm transition" required>
        </div>

        <!-- Date Inputs -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Target Date</label>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Year</span>
              <input type="number" id="inputYear" min="2000" max="2100" class="w-full glass-input text-white rounded-xl px-3 py-2 text-sm text-center font-mono" required>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Month</span>
              <input type="number" id="inputMonth" min="1" max="12" class="w-full glass-input text-white rounded-xl px-3 py-2 text-sm text-center font-mono" required>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Day</span>
              <input type="number" id="inputDay" min="1" max="31" class="w-full glass-input text-white rounded-xl px-3 py-2 text-sm text-center font-mono" required>
            </div>
          </div>
        </div>

        <!-- Time Inputs -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Target Time (24h)</label>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Hour</span>
              <input type="number" id="inputHour" min="0" max="23" class="w-full glass-input text-white rounded-xl px-3 py-2 text-sm text-center font-mono" required>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Minute</span>
              <input type="number" id="inputMinute" min="0" max="59" class="w-full glass-input text-white rounded-xl px-3 py-2 text-sm text-center font-mono" required>
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">Second</span>
              <input type="number" id="inputSecond" min="0" max="59" class="w-full glass-input text-white rounded-xl px-3 py-2 text-sm text-center font-mono" required>
            </div>
          </div>
        </div>

        <!-- UTC Offset Selection -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Timezone (UTC Offset)</label>
          <select id="inputUtc" class="w-full glass-input text-white rounded-xl px-3 py-2.5 text-sm bg-slate-900 cursor-pointer">
            <option value="-12:00">UTC -12:00 (Anywhere on Earth)</option>
            <option value="-11:00">UTC -11:00 (Samoa, Niue)</option>
            <option value="-10:00">UTC -10:00 (Hawaii)</option>
            <option value="-09:00">UTC -09:00 (Alaska)</option>
            <option value="-08:00">UTC -08:00 (Pacific Time - US/Canada)</option>
            <option value="-07:00">UTC -07:00 (Mountain Time - US/Canada)</option>
            <option value="-06:00">UTC -06:00 (Central Time - US/Canada)</option>
            <option value="-05:00">UTC -05:00 (Eastern Time - US/Canada)</option>
            <option value="-04:00">UTC -04:00 (Atlantic Time)</option>
            <option value="-03:00">UTC -03:00 (Argentina, Brazil East)</option>
            <option value="-02:00">UTC -02:00 (Mid-Atlantic)</option>
            <option value="-01:00">UTC -01:00 (Azores, Cape Verde)</option>
            <option value="+00:00" selected>UTC +00:00 (GMT / London)</option>
            <option value="+01:00">UTC +01:00 (Central European Time)</option>
            <option value="+02:00">UTC +02:00 (Eastern European Time)</option>
            <option value="+03:00">UTC +03:00 (Moscow, East Africa)</option>
            <option value="+04:00">UTC +04:00 (Gulf Standard Time, Dubai)</option>
            <option value="+05:00">UTC +05:00 (Pakistan)</option>
            <option value="+05:30">UTC +05:30 (India Standard Time)</option>
            <option value="+06:00">UTC +06:00 (Bangladesh)</option>
            <option value="+07:00">UTC +07:00 (Indochina Time, Bangkok)</option>
            <option value="+08:00">UTC +08:00 (China, Hong Kong, Singapore)</option>
            <option value="+09:00">UTC +09:00 (Japan Standard Time, Seoul)</option>
            <option value="+09:30">UTC +09:30 (Australian Central Time)</option>
            <option value="+10:00">UTC +10:00 (Australian Eastern Time)</option>
            <option value="+12:00">UTC +12:00 (New Zealand)</option>
            <option value="+13:00">UTC +13:00 (Tonga, Kiribati)</option>
          </select>
        </div>

        <!-- Action Buttons -->
        <div class="pt-4 flex items-center space-x-3">
          <button type="submit" class="flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 font-bold text-sm text-white rounded-xl shadow-lg shadow-indigo-600/30 transition active:scale-95">
            Apply & Save URL
          </button>
          <button type="button" id="resetDefaultsBtn" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 font-semibold text-sm text-slate-300 rounded-xl border border-slate-700 transition">
            Preset (+7d)
          </button>
        </div>

      </form>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-out pointer-events-none">
    <div class="glass-card border border-emerald-500/40 bg-slate-900/90 text-emerald-300 px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3">
      <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
      <span id="toastMsg" class="text-sm font-semibold">Share link copied to clipboard!</span>
    </div>
  </div>

  <footer class="w-full max-w-6xl mx-auto px-4 py-6 text-center text-xs text-slate-500 z-10">
    <p>Powered by TimePulse • Bookmark or share the generated URL anytime</p>
  </footer>

  <script>
    let countdownInterval = null;
    let targetTimestamp = null;

    // Helper to pad single digits with leading zero
    function padZero(num) {
      return String(num).padStart(2, '0');
    }

    // Helper to format months by name
    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = message;
      
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    function getParamsFromURL() {
      const params = new URLSearchParams(window.location.search);
      const now = new Date();
      
      // Default target: 7 days from right now
      const defaultTarget = new Date(now.getTime() + (7 * 24 * 60 * 60 * 1000));

      return {
        title: params.get('title') || 'Upcoming Event',
        year: parseInt(params.get('year')) || defaultTarget.getFullYear(),
        month: parseInt(params.get('month')) || (defaultTarget.getMonth() + 1),
        day: parseInt(params.get('day')) || defaultTarget.getDate(),
        hour: parseInt(params.get('hour')) !== null && !isNaN(parseInt(params.get('hour'))) ? parseInt(params.get('hour')) : 12,
        minute: parseInt(params.get('minute')) !== null && !isNaN(parseInt(params.get('minute'))) ? parseInt(params.get('minute')) : 0,
        second: parseInt(params.get('second')) !== null && !isNaN(parseInt(params.get('second'))) ? parseInt(params.get('second')) : 0,
        utc: params.get('utc') || '+00:00'
      };
    }

    function parseTargetDate(config) {
      const yearStr = config.year;
      const monthStr = padZero(config.month);
      const dayStr = padZero(config.day);
      const hourStr = padZero(config.hour);
      const minStr = padZero(config.minute);
      const secStr = padZero(config.second);
      const utcOffset = config.utc.includes(':') ? config.utc : '+00:00';

      const isoFormatted = `${yearStr}-${monthStr}-${dayStr}T${hourStr}:${minStr}:${secStr}${utcOffset}`;
      const dateObj = new Date(isoFormatted);

      if (isNaN(dateObj.getTime())) {
        // Fallback if user enters invalid date (e.g. Feb 31)
        return new Date();
      }
      return dateObj;
    }

    function populateFormInputs(config) {
      document.getElementById('inputTitle').value = config.title;
      document.getElementById('inputYear').value = config.year;
      document.getElementById('inputMonth').value = config.month;
      document.getElementById('inputDay').value = config.day;
      document.getElementById('inputHour').value = config.hour;
      document.getElementById('inputMinute').value = config.minute;
      document.getElementById('inputSecond').value = config.second;
      
      const utcSelect = document.getElementById('inputUtc');
      if (Array.from(utcSelect.options).some(opt => opt.value === config.utc)) {
        utcSelect.value = config.utc;
      } else {
        utcSelect.value = '+00:00';
      }
    }

    function startCountdownTimer(config) {
      if (countdownInterval) clearInterval(countdownInterval);

      const targetDate = parseTargetDate(config);
      targetTimestamp = targetDate.getTime();

      // Render Title & Human-readable Target display
      document.getElementById('displayTitle').textContent = config.title;
      
      const readableMonth = monthNames[config.month - 1] || "Month";
      const readableTime = `${padZero(config.hour)}:${padZero(config.minute)}:${padZero(config.second)}`;
      document.getElementById('targetFormattedDisplay').textContent = 
        `Target: ${readableMonth} ${config.day}, ${config.year} at ${readableTime} (UTC ${config.utc})`;

      function tick() {
        const now = Date.now();
        const diff = targetTimestamp - now;

        if (diff <= 0) {
          // Timer finished
          document.getElementById('daysVal').textContent = '00';
          document.getElementById('hoursVal').textContent = '00';
          document.getElementById('minutesVal').textContent = '00';
          document.getElementById('secondsVal').textContent = '00';
          document.getElementById('statusMessage').innerHTML = '<span class="text-emerald-400 font-bold text-lg animate-bounce inline-block">🎉 The event has arrived!</span>';
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('daysVal').textContent = padZero(days);
        document.getElementById('hoursVal').textContent = padZero(hours);
        document.getElementById('minutesVal').textContent = padZero(minutes);
        document.getElementById('secondsVal').textContent = padZero(seconds);

        document.getElementById('statusMessage').textContent = 'Countdown actively ticking...';
      }

      tick();
      countdownInterval = setInterval(tick, 1000);
    }

    function updateURLAndConfig(config) {
      const searchParams = new URLSearchParams();
      searchParams.set('title', config.title);
      searchParams.set('year', config.year);
      searchParams.set('month', config.month);
      searchParams.set('day', config.day);
      searchParams.set('hour', config.hour);
      searchParams.set('minute', config.minute);
      searchParams.set('second', config.second);
      searchParams.set('utc', config.utc);

      const newRelativePathQuery = window.location.pathname + '?' + searchParams.toString();
      window.history.pushState(null, '', newRelativePathQuery);

      startCountdownTimer(config);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const config = getParamsFromURL();
      populateFormInputs(config);
      startCountdownTimer(config);

      // Drawer toggle
      const settingsDrawer = document.getElementById('settingsDrawer');
      const toggleBtn = document.getElementById('toggleSettingsBtn');
      const closeBtn = document.getElementById('closeSettingsBtn');

      toggleBtn.addEventListener('click', () => {
        settingsDrawer.classList.remove('hidden');
      });

      closeBtn.addEventListener('click', () => {
        settingsDrawer.classList.add('hidden');
      });

      settingsDrawer.addEventListener('click', (e) => {
        if (e.target === settingsDrawer) {
          settingsDrawer.classList.add('hidden');
        }
      });

      // Form submission
      document.getElementById('configForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const updatedConfig = {
          title: document.getElementById('inputTitle').value.trim() || 'Countdown Event',
          year: parseInt(document.getElementById('inputYear').value) || 2026,
          month: parseInt(document.getElementById('inputMonth').value) || 1,
          day: parseInt(document.getElementById('inputDay').value) || 1,
          hour: parseInt(document.getElementById('inputHour').value) || 0,
          minute: parseInt(document.getElementById('inputMinute').value) || 0,
          second: parseInt(document.getElementById('inputSecond').value) || 0,
          utc: document.getElementById('inputUtc').value
        };

        updateURLAndConfig(updatedConfig);
        settingsDrawer.classList.add('hidden');
        showToast('Countdown updated & URL saved!');
      });

      // Preset button (+7 days)
      document.getElementById('resetDefaultsBtn').addEventListener('click', () => {
        const future = new Date(Date.now() + (7 * 24 * 60 * 60 * 1000));
        document.getElementById('inputYear').value = future.getFullYear();
        document.getElementById('inputMonth').value = future.getMonth() + 1;
        document.getElementById('inputDay').value = future.getDate();
        document.getElementById('inputHour').value = 12;
        document.getElementById('inputMinute').value = 0;
        document.getElementById('inputSecond').value = 0;
        document.getElementById('inputUtc').value = '+00:00';
      });

      // Copy Shareable Link helper
      document.getElementById('copyShareBtn').addEventListener('click', () => {
        const shareUrl = window.location.href;
        
        // Use standard execCommand fallback for seamless clipboard copy
        const tempInput = document.createElement('input');
        tempInput.value = shareUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
          document.execCommand('copy');
          showToast('Share link copied to clipboard!');
        } catch (err) {
          showToast('Failed to copy link. Please copy browser URL directly.');
        }
        document.body.removeChild(tempInput);
      });
    });
  </script>
</body>
</html>
